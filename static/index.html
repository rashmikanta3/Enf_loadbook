<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Book Inspection Entry</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">
    <link rel="apple-touch-icon" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="nav-bar">
        <span>⚡ TPSODL Enforcement Portal</span>
        <a href="/summary" class="nav-link">📊 Management Summary Page →</a>
    </div>

    <div class="container container-sm">
        <section class="card">
            <h2>Inspection Entry Form</h2>
            <form id="inspectionForm">

                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="empId">Employee ID *</label>
                        <div class="input-with-status">
                            <input type="text" id="empId" placeholder="e.g. 522604" required autocomplete="off">
                            <span id="lookupStatus" class="status-indicator"></span>
                        </div>
                    </div>
                    <div class="form-group flex-1">
                        <label for="inspectionDate">Inspection Date *</label>
                        <input type="date" id="inspectionDate" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="empName">Employee Name</label>
                    <input type="text" id="empName" readonly placeholder="Auto-fills from database">
                </div>

                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="circle">Assigned Circle</label>
                        <input type="text" id="circle" readonly placeholder="Auto-populated">
                    </div>
                    <div class="form-group flex-1">
                        <label for="team">Assigned Team</label>
                        <input type="text" id="team" readonly placeholder="Auto-populated">
                    </div>
                </div>

                <div class="form-group">
                    <label>Theft Type *</label>
                    <div class="radio-options">
                        <label class="radio-label">
                            <input type="radio" name="theftType" value="DAE" required>
                            <span>DAE (Meter Tamper/Meter-Bypass)</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="theftType" value="DT">
                            <span>DT (Direct Hooking/Cable-Cut)</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="theftType" value="MISUSE">
                            <span>MISUSE(Tariff Misuse/SUBLETTING OF POWER)</span>
                        </label>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="loadBookNo">PVR Book No. *</label>
                        <input type="text" id="loadBookNo" placeholder="e.g 0123" required>
                    </div>
                    <div class="form-group flex-1">
                        <label for="pageNo">PVR Page No.(enter only one page number) *</label>
                        <input type="text" id="pageNo" placeholder="e.g 0012" required>
                    </div>
                </div>

                <!-- Inside static/index.html: Update the Assessed Load form-group -->
                <div class="form-group">
                    <label for="assessedLoad">Assessed Load (kW)</label>
                    <input type="number" id="assessedLoad" step="0.001" min="0.001" max="100.000" placeholder="e.g. 2.450"
                        required value="${parseFloat(item.assessed_load_kw).toFixed(3)}">
                </div>

                <button type="submit" id="submitBtn">Save Entry</button>
                <div id="alertBox" class="alert hidden"></div>
            </form>
        </section>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
